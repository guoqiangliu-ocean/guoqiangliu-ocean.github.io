<style>
:root{--bg:#fafbfc;--card:#fff;--border:#e2e8f0;--border2:#cbd5e1;--text:#1e293b;--text2:#475569;--text3:#94a3b8;--accent:#2563eb;--accent2:#7c3aed;--green:#059669;--amber:#d97706;--pink:#db2777;--red:#dc2626;--eq-bg:#f1f5f9;--note-bg:#eff6ff;--note-border:#93c5fd;--warn-bg:#fffbeb;--warn-border:#fcd34d}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:'Helvetica Neue',system-ui,sans-serif;line-height:1.75;font-size:14px}.hdr{text-align:center;padding:48px 20px 32px;border-bottom:1px solid var(--border);background:#fff}.hdr h1{font-size:1.7em;font-weight:800;margin-bottom:6px}.hdr .sub{font-size:.92em;color:var(--text2);max-width:640px;margin:0 auto 16px}.chain{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;font-size:11px;font-family:'SF Mono',Consolas,monospace}.chain span{padding:2px 7px;border-radius:4px;cursor:pointer;transition:all .15s}.chain .c-node{background:#f1f5f9;border:1px solid #e2e8f0;color:var(--text2)}.chain .c-node:hover{background:#dbeafe;border-color:#93c5fd;color:var(--accent)}.chain .c-arr{color:#cbd5e1;border:none;background:none}.main{max-width:880px;margin:0 auto;padding:28px 16px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-bottom:20px}.stat{text-align:center;padding:12px 8px;background:#fff;border:1px solid var(--border);border-radius:8px}.stat-n{font-family:'SF Mono',Consolas,monospace;font-size:1.6em;font-weight:800}.stat-l{font-size:10.5px;color:var(--text2);margin-top:2px}.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px;margin-bottom:22px;background:#fff;border-radius:8px;border:1px solid var(--border)}.tag{font-size:10.5px;padding:2px 8px;border-radius:999px;font-family:'SF Mono',Consolas,monospace;white-space:nowrap;font-weight:500}.t-id{background:#dbeafe;color:#1d4ed8;border:1px solid #93c5fd}.t-th{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}.t-as{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}.t-in{background:#fce7f3;color:#9d174d;border:1px solid #f9a8d4}.t-re{background:#ede9fe;color:#5b21b6;border:1px solid #c4b5fd}.node{margin-bottom:2px;position:relative}.node::before{content:'';position:absolute;left:23px;top:52px;bottom:-2px;width:2px;background:var(--border)}.node:last-child::before{display:none}.n-hdr{display:flex;align-items:center;gap:12px;padding:11px 16px;background:#fff;border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s;position:relative;z-index:1}.n-hdr:hover{border-color:var(--border2);box-shadow:0 1px 4px rgba(0,0,0,.05)}.n-hdr.open{border-radius:10px 10px 0 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}.n-num{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'SF Mono',Consolas,monospace;font-weight:800;font-size:13px;color:#fff;flex-shrink:0}.n-title{font-weight:700;font-size:14px;margin-bottom:1px}.n-sub{font-size:11.5px;color:var(--text2);font-family:'SF Mono',Consolas,monospace}.n-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.chev{font-size:12px;color:var(--text3);transition:transform .25s;flex-shrink:0}.chev.open{transform:rotate(180deg)}.n-body{display:none;background:#fff;border:1px solid var(--border2);border-top:none;border-radius:0 0 10px 10px;padding:16px 20px}.n-body.open{display:block}.ss-hdr{padding:8px 12px;border-radius:6px;cursor:pointer;border:1px solid transparent;transition:all .15s;margin-bottom:2px}.ss-hdr:hover{background:#f8fafc;border-color:#e2e8f0}.ss-hdr.open{background:#f1f5f9;border-color:#cbd5e1}.ss-title{font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px}.ss-bar{width:3px;height:13px;border-radius:2px;flex-shrink:0}.ss-chev{margin-left:auto;font-size:9px;color:var(--text3);transition:transform .2s}.ss-chev.open{transform:rotate(180deg)}.ss-body{padding:4px 4px 4px 20px;margin-left:13px;border-left:2px solid #e2e8f0}.si-hdr{padding:6px 10px;border-radius:5px;cursor:pointer;transition:background .15s;display:flex;align-items:center;gap:7px}.si-hdr:hover{background:#f8fafc}.si-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}.si-label{font-weight:600;font-size:12.5px;color:var(--text)}.si-chev{margin-left:auto;font-size:9px;color:var(--text3);transition:transform .2s}.si-chev.open{transform:rotate(90deg)}.si-body{padding:6px 10px 8px 22px;font-size:12.5px;color:var(--text2);line-height:1.8;margin-left:2px;border-left:2px solid #f1f5f9}.eq-block{background:var(--eq-bg);border-left:3px solid var(--accent);padding:8px 14px;border-radius:0 6px 6px 0;margin:6px 0;overflow-x:auto}.note-block{background:var(--note-bg);border-left:3px solid var(--note-border);padding:7px 12px;border-radius:0 6px 6px 0;margin:6px 0;font-size:12px}.warn-block{background:var(--warn-bg);border-left:3px solid var(--warn-border);padding:7px 12px;border-radius:0 6px 6px 0;margin:6px 0;font-size:12px}.conn{text-align:center;padding:2px 0;position:relative;z-index:1}.conn-line{width:2px;height:18px;margin:0 auto;border-radius:1px}@media(max-width:640px){.hdr h1{font-size:1.3em}.n-hdr{padding:8px 10px;gap:8px}.n-num{width:34px;height:34px;font-size:11px}}

var CHAIN=["NS","Helmholtz","Vortex Force","3-Layer+SVF","MZ Proj.","GLE","FDR-II","GK+Bochner","Kolmogorov","Force Kernel","Scaling Law","\u0049t\u00f4 Corr.","CLT Dist.","Fig4 Ens.","Fig5 Path"];
var STATS=[{n:"15",l:"Main Nodes",c:"#2563eb"},{n:"6",l:"Exact Identities",c:"#1d4ed8"},{n:"3",l:"Theorems",c:"#059669"},{n:"6",l:"Assumptions A1\u2013A6",c:"#d97706"},{n:"1",l:"Empirical Input",c:"#db2777"},{n:"0",l:"Free Params",c:"#dc2626"}];
var LEG=[["t-id","Identity"],["t-th","Theorem"],["t-as","Assumption"],["t-in","Empirical"],["t-re","Result"]];

var NODES=[
{id:"ns",n:"01",cl:"#2563eb",title:"Navier\u2013Stokes Equations",si:"SI \xa7S1.A",sub:"Incompressible NS \xb7 Boussinesq \xb7 Exact starting point",tg:[["t-id","Exact Eqn"]],
ss:[{title:"Exact Equations",cl:"#2563eb",it:[
 {label:"NS Equations",eq:"\\partial_t \\boldsymbol{U}+(\\boldsymbol{U}\\cdot\\nabla)\\boldsymbol{U}=-\\frac{1}{\\rho}\\nabla P+\\nu\\nabla^2\\boldsymbol{U},\\quad \\nabla\\cdot\\boldsymbol{U}=0",text:"Incompressible Newtonian fluid, constant density \u03c1, kinematic viscosity \u03bd. This is the sole starting point; everything follows from here."},
 {label:"Why start from NS",text:"Classical CL theory starts from decomposed wave equations, discarding u_\u03c6 \u00d7 \u03c9\u2032 during phase averaging. SVF theory must start from the unsplit NS to capture this crucial term."},
 {label:"Validity",text:"Deep water kh \u226b 1; incompressible Ma \u226a 1; Boussinesq approximation. Fully valid for the ocean mixed layer."},
]}]},

{id:"hlm",n:"02",cl:"#2563eb",title:"Helmholtz Decomposition",si:"SI \xa7S1.A Eq.S.2",sub:"U = u_\u03c6 + u_\u03c8 \xb7 Irrotational (wave) + Rotational (flow)",tg:[["t-id","Exact"]],
ss:[{title:"Mathematical Structure",cl:"#2563eb",it:[
 {label:"Definition",eq:"\\boldsymbol{U}=\\underbrace{\\nabla\\phi}_{\\boldsymbol{u}_\\phi\\text{ (wave)}}+\\underbrace{\\nabla\\times\\boldsymbol{\\psi}}_{\\boldsymbol{u}_\\psi\\text{ (flow)}}",text:"Exact mathematical identity. Irrotational part carries waves, rotational part carries vorticity/turbulence."},
 {label:"Orthogonality & Energy",eq:"\\int \\boldsymbol{u}_\\phi\\cdot\\boldsymbol{u}_\\psi\\,dV=0,\\qquad E=\\tfrac{1}{2}\\int|\\boldsymbol{u}_\\phi|^2+\\tfrac{1}{2}\\int|\\boldsymbol{u}_\\psi|^2",text:"Cross-term vanishes. Wave and flow energies are mathematically decoupled."},
]}]},

{id:"vrt",n:"03",cl:"#2563eb",title:"Orbital Vortex Force + Energy Budget",si:"SI \xa7S1.B Eq.S.7\u201311",sub:"f_v = u_\u03c6 \u00d7 \u03c9 \xb7 Sole non-viscous channel for wave energy in NS",tg:[["t-id","Exact"],["t-th","Energy Thm"]],
ss:[{title:"Vortex-Force Form",cl:"#2563eb",it:[
 {label:"Exact derivation (see SI \xa7S1.B Eq.S.7\u20139)",text:"Applying vector identities to the total-field NS, absorbing gradients into modified pressure \u03a0, yields the vortex-force form. From Helmholtz decomposition and \u2207\u00d7u_\u03c6 = 0, the wave-flow energy exchange component is exactly u_\u03c6 \u00d7 \u03c9."},
]},{title:"Wave-Energy Exchange Theorem (see SI \xa7S1.B Eq.S.10\u201311)",cl:"#059669",it:[
 {label:"Exact Result",text:"Projecting NS onto the irrotational subspace yields the wave-energy budget. Self-advection and modified pressure integrate to zero. u_\u03c6 \u00d7 \u03c9 is the sole non-viscous channel for wave energy change in NS \u2014 proven exactly, not assumed."},
 {label:"Viscous Channel Excluded",text:"Molecular viscous spatial decay rate \u03bc_visc = 4\u03bdk\u00b2/c_g. For T = 14\u201320 s swell, \u03bc_visc ~ 10\u207b\u00b9\u00b9\u201310\u207b\u00b9\u2070 m\u207b\u00b9, three to four orders below observations ~10\u207b\u2077."},
]}]},

{id:"3ly",n:"04",cl:"#2563eb",title:"Three-Layer Vorticity \u2192 CL + SVF",si:"SI \xa7S1.C\u2013E Eq.S.24\u201344",sub:"\u03c9 = \u03a9\u0304 + \u03c9\u2032 + \u03c9_wave \xb7 Three-channel exclusion \u2192 SVF is the sole irreversible channel",tg:[["t-id","Exact"],["t-as","A1\u2013A2"]],
ss:[{title:"Three-Layer Vorticity Decomposition",cl:"#2563eb",it:[
 {label:"Three Layers (see SI \xa7S1.C\u2013E)",eq:"\\boldsymbol{\\omega}=\\bar{\\boldsymbol{\\Omega}}+\\boldsymbol{\\omega}'+\\boldsymbol{\\omega}_{\\mathrm{wave}}",text:"\u03a9\u0304 = ensemble-mean vorticity; \u03c9\u2032 = turbulent fluctuation (\u27e8\u03c9\u2032\u27e9=0); \u03c9_wave \u2248 \u2207\u00d7(\u03be\u00d7\u03a9_s) wave-slaved, no independent DOF. This decomposition extends the Craik\u2013Leibovich framework (McWilliams 2022), identifying a third layer in the orbital vortex force that classical theory discards."},
]},{title:"Three-Channel Exclusion \u2192 SVF Uniqueness (see SI \xa7S1.D\u2013E)",cl:"#7c3aed",it:[
 {label:"Term I: u_\u03c6 \u00d7 \u03a9\u0304 \u2192 Conservative",text:"\u03a9\u0304 has no internal DOF. Work done each half-cycle is exactly returned. Zero net dissipation (conservative frequency shift only)."},
 {label:"Term II: u_\u03c6 \u00d7 \u03c9_wave \u2192 Conservative",text:"\u03c9_wave is wave-slaved with no independent DOF. Product has spectral support at 0 (=CL force, modifies mean flow without damping waves) and 2\u03c9 (no projection onto swell mode). Conservative w.r.t. wave amplitude."},
 {label:"Term III: u_\u03c6 \u00d7 \u03c9\u2032 \u2192 Irreversible \u2713",text:"\u03c9\u2032 possesses internal DOF (full turbulent cascade) \u2014 eddies redistribute received energy to smaller scales within one wave period, erasing phase information needed for exact return. Combined with spatial decorrelation, this is the only component with both irreversibility ingredients.",warn:true},
 {label:"SVF Definition (see SI \xa7S1.E Eq.S.37)",eq:"\\boldsymbol{f}_{\\mathrm{svf}}\\equiv\\boldsymbol{u}_\\phi\\times\\boldsymbol{\\omega}'",text:"Phase average is zero (classical theory discards it). But its autocorrelation is nonzero. Dissipation is determined by second-order statistics (autocorrelation), not first-order (mean)."},
]},{title:"Assumptions A1\u2013A2 (see SI \xa7S2.A)",cl:"#d97706",it:[
 {label:"A1 (Resolved Wave Band)",text:"Swell occupies a narrow band \u212c; each k \u2208 \u212c admits a linear dispersion relation with modal energy E_k = |a_k|\u00b2/2. Nonlinear wave-wave interactions negligible on attenuation timescale (ka ~ 0.01)."},
 {label:"A2 (Time-Scale Separation)",eq:"\\tau_c\\sim\\ell/c_g\\sim 5\\,\\mathrm{s}\\;\\ll\\;\\Gamma^{-1}\\sim 10^5\\text{--}10^6\\,\\mathrm{s}",text:"Separation ratio ~10\u2074. A2 is not needed for \u0393 \u2265 0 (guaranteed by Bochner alone), but is needed to interpret the Green\u2013Kubo coefficient as an exponential decay rate."},
]}]},

{id:"mz",n:"05",cl:"#7c3aed",title:"Mori\u2013Zwanzig Projection",si:"SI \xa7S2.B\u2013E",sub:"Slow variable a_k \xb7 Bath \u03c9\u2032 \xb7 Orthogonal projection Q \u2192 F_k",tg:[["t-id","Exact"],["t-as","A3\u2013A6"]],
ss:[{title:"Projection Framework",cl:"#7c3aed",it:[
 {label:"DOF Partition",text:"Slow: swell amplitude a_k(t) (timescale ~ \u0393\u207b\u00b9 ~ 10\u2076 s). Fast/bath: \u03c9\u2032(x,t) (correlation ~ \u03c4_c ~ 5 s). Ratio ~ 10\u2075. MZ projection is an exact operator identity \u2014 no approximation, just a rewriting."},
]},{title:"Assumptions A3\u2013A6 (see SI \xa7S2.A)",cl:"#d97706",it:[
 {label:"A3(i) Stationarity & Homogeneity",text:"\u03c9\u2032 is locally stationary and homogeneous within analysis patches of size O(k\u207b\u00b9). Mixed layer is in non-equilibrium steady state (NESS) under sustained wind forcing."},
 {label:"A3(ii) Phase Independence \u26a0",text:"Swell phase \u03b8_k is statistically independent of \u03c9\u2032. Physical basis: remote swell originates from storms ~10\u2074 km away, causally disconnected from local turbulence. Fails for local wind waves \u2014 this precisely defines the theory\u2019s domain.",warn:true},
 {label:"A3(iii) Zero Ensemble Mean",text:"\u27e8\u03c9\u2032\u27e9 = 0. Turbulent fluctuations are symmetrically distributed about the ensemble mean \u03a9\u0304."},
 {label:"A4 (Linear Truncation)",eq:"\\delta\\equiv u'/c_g\\sim 10^{-3}\\text{--}10^{-2}\\ll 1",text:"SVF enters the amplitude equation at first order in a_k; feedback of order |a_k|\u00b2 negligible. Ensures: single encounter \u0394E/E ~ \u03b4 \u226a 1; swell back-reaction negligible (bath approximation)."},
 {label:"A5 (Locally Stationary Reference Measure, see SI \xa7S2.A)",eq:"\\rho_{\\mathrm{ss}}\\approx\\rho_{\\mathrm{wave}}\\times\\rho_{\\mathrm{bath}}",text:"Mixed-layer turbulence admits a locally stationary reference measure \u03c1_bath(\u03c9\u2032) over \u03c4 \u2264 \u03c4_c, and the full measure factorises approximately into wave and bath parts. No equilibrium, detailed balance, or Boltzmann form imposed. Wave amplitude quasi-frozen over \u03c4_c (\u0393\u03c4_c ~ 10\u207b\u2076\u201310\u207b\u2074), making C_F(\u03c4) and the MZ inner product well-defined to leading order in \u03b4."},
 {label:"A6 (Finite Memory, see SI \xa7S2.A)",text:"The mode-projected SVF has an absolutely integrable autocorrelation, so that the Green\u2013Kubo integral converges. Physical origin: advective decorrelation decays the force autocorrelation on timescale \u03c4_eff ~ (qc_g)\u207b\u00b9 ~ 5 s."},
]}]},

{id:"gle",n:"06",cl:"#7c3aed",title:"Generalised Langevin Equation (GLE)",si:"SI \xa7S2.E\u2013F",sub:"da_k/dt = i\u03c9 a_k \u2212 \u222bK a_k ds + F_k(t) \xb7 Multiplicative noise",tg:[["t-re","MZ Exact Output"]],
ss:[{title:"GLE and Multiplicative Noise",cl:"#7c3aed",it:[
 {label:"Three-Term Structure (see SI \xa7S2.E)",eq:"\\frac{da_k}{dt}=i\\omega_k a_k-\\int_0^t K_k(t-s)\\,a_k(s)\\,ds+F_k(t)",text:"Free oscillation + memory friction + random force. Both K_k and F_k are fully determined by SVF statistics, not independent inputs. F_k(t) is additive in the a_k equation; multiplicative noise emerges only in the energy E_k = |a_k|\u00b2/2 dynamics."},
 {label:"Multiplicative Noise in Energy Dynamics (see SI \xa7S2.F\u2013G)",text:"Energy noise \u03b7 = Re[a_k* F_k] is proportional to a_k \xb7 \u03c9\u2032 \u2014 multiplicative. This follows from SVF\u2019s bilinear structure f_svf = u_\u03c6 \u00d7 \u03c9\u2032 (where u_\u03c6 \u221d a_k). The convention E_k = |a_k|\u00b2/2 ensures FDR-II and Green\u2013Kubo denominators consistently read 2E_k = \u27e8|a_k|\u00b2\u27e9."},
]}]},

{id:"fdr",n:"07",cl:"#7c3aed",title:"FDR-II (Second Fluctuation-Dissipation Relation)",si:"SI \xa7S2.C Eq.S.50",sub:"K_k(\u03c4) = \u27e8F(0)F*(\u03c4)\u27e9 / 2E_k \xb7 No thermal equilibrium required",tg:[["t-id","Exact"],["t-as","A3, A5"]],
ss:[{title:"Proof of FDR-II (see SI \xa7S2.C)",cl:"#059669",it:[
 {label:"Formula",eq:"K_{\\boldsymbol{k}}(\\tau)=\\frac{\\langle F_{\\boldsymbol{k}}(0)\\,F_{\\boldsymbol{k}}^*(\\tau)\\rangle}{\\langle|a_{\\boldsymbol{k}}|^2\\rangle}",text:"Locks the friction kernel (K) to the noise autocorrelation (F). Proof requires only: (i) self-adjointness of P (by construction); (ii) time-translation invariance under \u03c1_ss (only A3 stationarity and A5 measure factorisation needed, no detailed balance or Liouville self-adjointness)."},
 {label:"Non-Equilibrium Applicability",text:"Ocean mixed layer = mechanically driven NESS (not thermal equilibrium). Evans & Morriss (2008), Marconi et al. (2008) established non-equilibrium FDR theory. Han et al. (2021, Nature Physics) experimentally verified non-equilibrium Green\u2013Kubo in chiral active fluids."},
]},{title:"Core Physical Meaning",cl:"#7c3aed",it:[
 {label:"Einstein Analogy",text:"Just as D = kT/(6\u03c0\u03b7a) locks diffusion (noise) and friction to a common source: in SVF theory, mean \u03bc_E and variance \u03c3\u00b2(\u03bc\u0302) are both determined by the same F_k autocorrelation. This is the mathematical foundation of the dual-line prediction \u2014 no independent scatter parameter needed."},
]}]},

{id:"gk",n:"08",cl:"#059669",title:"Green\u2013Kubo Formula + Bochner\u2019s Theorem",si:"SI \xa7S2.E Eq.S.53\u201359",sub:"\u0393(k) \u2265 0 guaranteed by Bochner \xb7 H-theorem",tg:[["t-th","Bochner \u2192 \u0393\u22650"],["t-re","H-theorem"],["t-as","A6"]],
ss:[{title:"Green\u2013Kubo Coefficient (see SI \xa7S2.E)",cl:"#059669",it:[
 {label:"Markov Limit",eq:"\\Gamma(\\boldsymbol{k})=\\frac{1}{2E_{\\boldsymbol{k}}}\\int_0^\\infty\\!\\operatorname{Re}\\bigl\\langle F_{\\boldsymbol{k}}(0)\\,F_{\\boldsymbol{k}}^*(\\tau)\\bigr\\rangle\\,d\\tau\\;\\geq\\;0",text:"Under A2 (\u03c4_c \u226a \u0393\u207b\u00b9), memory integral reduces to local friction. Convergence guaranteed by A6 (finite memory). Not an eddy-viscosity fit \u2014 exact linear response of the wave-turbulence system to SVF fluctuations."},
 {label:"Bochner\u2019s Theorem \u2192 \u0393 \u2265 0",text:"F_k(t) stationary \u21d2 power spectrum S_F(\u03c9) \u2265 0 (Bochner 1933). GK integral = S_F(0)/2 \u2265 0. Thus \u0393 \u2265 0 is a theorem, not an assumption."},
]},{title:"H-Theorem and Irreversibility Mechanism",cl:"#059669",it:[
 {label:"Swell-Subspace H-Theorem",eq:"\\frac{d\\langle E_w\\rangle}{dt}=-2\\Gamma\\langle E_w\\rangle\\leq 0",text:"Structurally identical to Boltzmann\u2019s H-theorem: macroscopic irreversibility emerges from microscopically reversible dynamics because the turbulent bath has far more DOF than the swell subspace."},
 {label:"One-Way Valve Mechanism",text:"Each encounter has nearly symmetric energy exchange. But eddies immediately redistribute energy to smaller scales via the Kolmogorov cascade, erasing phase information needed for exact return. Energy enters the turbulent continuum; it cannot spontaneously reorganise into a narrow-band force at the swell frequency and phase."},
]}]},

{id:"kol",n:"09",cl:"#db2777",title:"Kolmogorov Inertial Subrange (Sole Empirical Input)",si:"SI \xa7S3\u2013S4, \xa7S5.F\u2013H",sub:"E(q) = C_K \u03b5^{2/3} q^{-5/3} \xb7 Six decades of experimental support",tg:[["t-in","Independent Expt"]],
ss:[{title:"Spectral Input",cl:"#db2777",it:[
 {label:"Kolmogorov Spectrum",eq:"E_\\omega(q)=q^2 E_u(q)=C_K\\,\\varepsilon^{2/3}\\,q^{1/3}",text:"E_u(q) = C_K \u03b5^{2/3} q^{-5/3} (velocity), E_\u03c9 = q\u00b2E_u (vorticity has extra q\u00b2). C_K \u2248 1.5 from independent turbulence experiments. This is the sole empirical input in the entire derivation chain \u2014 not fitted to swell data, but a universal scaling established by six decades of independent turbulence experiments."},
 {label:"Validity of the Empirical Input (see SI \xa7S5.F\u2013H)",text:"Swell-selected scales q ~ k ~ 0.01\u20130.03 rad/m (inverse wavenumbers ~30\u201380 m). Theory only requires horizontal vorticity spectrum to follow -5/3 at these scales \u2014 full isotropy not needed. Validity bounded by local Ozmidov scale L_O = (\u03b5/N\u00b3)^{1/2} and Kolmogorov scale \u03b7_K = (\u03bd\u00b3/\u03b5)^{1/4}. Kunze (2019) confirms horizontal spectra maintain \u03b5^{2/3} k_h^{-5/3} below the Ozmidov scale.",warn:true},
]}]},

{id:"fk",n:"10",cl:"#d97706",title:"SVF Force Kernel (Analytical Force Autocorrelation)",si:"SI \xa7S3\u2013S4 Eq.S.60\u201378",sub:"Angular integral \u2192 Geometric kernel W(q/k) \xb7 Frequency integral \u2192 \u03c4_eff \xb7 C_\u03c4 = 1",tg:[["t-re","Analytical"]],
ss:[{title:"Force Autocorrelation in Wavenumber Space (see SI \xa7S3.A\u2013C)",cl:"#d97706",it:[
 {label:"Spectral Representation of Force Kernel",text:"Green\u2013Kubo integral expanded in wavenumber-frequency space: \u0393(k) = \u222bd\u00b3q |V(k,q)|\u00b2 E_\u03c9(q)/(2qc_g). |V|\u00b2 is the vortex-force vertex, E_\u03c9 is the vorticity spectrum, 1/(qc_g) from advective decorrelation. Only vorticity modes matching swell in both wavenumber and frequency couple effectively."},
 {label:"Geometric Kernel (Scale-Selection Window, see SI \xa7S5.B)",eq:"\\widehat{W}_2(\\eta)=\\frac{\\eta^2}{(1+\\eta^2)^2},\\quad\\eta=q/k",text:"Baseline window (\u03b1 = 2, surface-injected turbulence + exponential depth decay) peaks at \u03b7 ~ 1 (q ~ k). Dominant coupling at turbulence scale \u2248 wave scale: \u2113 ~ k\u207b\u00b9 ~ 56 m (for 14 s swell). The band [k/2, 2k] accounts for ~58\u201366% of total attenuation (58% at \u03b1 = 2, 66% at \u03b1 = 5/2)."},
]},{title:"Frequency Integral and C_\u03c4 (see SI \xa7S5.C)",cl:"#d97706",it:[
 {label:"Effective Advective Decorrelation Time",eq:"\\tau_{\\mathrm{eff}}=\\frac{C_\\tau}{q\\,c_g}\\sim 5\\,\\mathrm{s}\\;\\ll\\;\\tau_{\\mathrm{eddy}}\\sim(\\varepsilon q^2)^{-1/3}\\sim 10^3\\,\\mathrm{s}",text:"Time for the wave-energy trajectory to traverse one eddy correlation length. Wave packet advances at c_g ~ 10 m/s while eddy moves at u\u2032 ~ 0.01 m/s. C_\u03c4 \u2208 [0.89, 1.25], baseline C_\u03c4 = 1."},
]}]},

{id:"law",n:"11",cl:"#059669",title:"Analytical Scaling Law (Zero-Parameter Prediction)",si:"SI \xa7S4\u2013S5",sub:"\u03bc_E(\u03c9) = C_tot \u03b5^{2/3} g^{-7/3} \u03c9^{8/3}",tg:[["t-re","Zero-Param"]],
ss:[{title:"Derivation of Scaling Law (see SI \xa7S4)",cl:"#059669",it:[
 {label:"Core Result",eq:"\\mu_E(\\omega)=C_{\\mathrm{tot}}\\,\\varepsilon_{\\mathrm{eff}}^{2/3}\\,g^{-7/3}\\,\\omega^{8/3}",text:"Substituting Kolmogorov vorticity spectrum into the force kernel integral (SI \xa7S3\u2013S4), all integrals evaluate analytically. The \u03c9^{8/3} exponent is uniquely determined by the k-scaling of the force kernel integral + deep-water dispersion k = \u03c9\u00b2/g."},
]},{title:"Five-Factor Decomposition: C_tot = 2\u03c0/3 (see SI \xa7S5, Table S1)",cl:"#059669",it:[
 {label:"Decomposition",eq:"C_{\\mathrm{tot}}=4\\cdot C_K\\cdot \\widetilde{G}_{\\mathrm{geom}}\\cdot C_{\\mathcal{S}}\\cdot C_\\tau\\cdot C_E=\\frac{2\\pi}{3}\\approx 2.094",text:"4 = c_g\u207b\u00b2 kinematic factor; C_K \u2248 1.5 from independent turbulence experiments; G\u0303_geom = analytical geometric integral; C_S = analytical window integral; C_\u03c4 = 1 baseline decorrelation (range [0.89, 1.25]); C_E = mixed-layer depth integral. All fixed by independent constraints \u2014 none fitted to swell data. C_tot \u2208 [1.10, 3.34] (SI \xa7S5, Table S1)."},
]}]},

{id:"ito",n:"12",cl:"#db2777",title:"It\u00f4 Correction (2,2,1 Structural Constants)",si:"SI \xa7S6.A\u2013B",sub:"\u27e8\u03bc\u0302\u27e9 = 2\u03bc_E \xb7 Var(\u03bc\u0302) = 2\u03bc_E/L \xb7 c\u2080 = 1",tg:[["t-re","Exact Constants"],["t-re","Obs. Correction"]],
ss:[{title:"It\u00f4 Correction Results (see SI \xa7S6.A\u2013B)",cl:"#db2777",it:[
 {label:"\u27e8\u03bc\u0302\u27e9 = 2\u03bc_E (Origin of factor 2)",text:"The ln E regression estimator \u03bc\u0302 has expectation 2\u03bc_E: half from physical damping \u0393, half from the It\u00f4 correction of multiplicative noise under log transform. The factor of 2 is uniquely fixed by FDR-II structural algebra (\u03b1 = \u03b2_\u03be/2), independent of force autocorrelation form. Full derivation in SI \xa7S6.A\u2013B."},
 {label:"c\u2080 = 1 (Variance structural constant)",eq:"\\mathrm{Var}(\\hat\\mu)=\\frac{c_0\\,\\mu_{\\mathrm{svf}}}{L},\\qquad c_0=1",text:"c\u2080 = B/A = \u03b2_\u03be/\u03b2_\u03be = 1, likewise fully determined by FDR-II algebra. Both 2 and 1 are exact structural constants \u2014 no assumption on force autocorrelation form, no thermal equilibrium, no ad hoc closure. See SI \xa7S6.B."},
]},{title:"Historical Impact",cl:"#dc2626",it:[
 {label:"It\u00f4 Bias in Satellite Estimators",text:"All ln E regression-based satellite estimators from Snodgrass (1966) to Stopa (2016): the SVF contribution measures 2\u03bc_E, not \u03bc_E \u2014 half from physical damping \u0393, half from multiplicative-noise It\u00f4 correction. The total observed log-slope is 2\u03bc_E + \u03bc_v (Dore laminar viscous contribution ~13\u201321%). First identification of this systematic factor in 60 years."},
]}]},

{id:"clt",n:"13",cl:"#db2777",title:"CLT \u2192 Full Pathwise Distribution (Dual-Line Prediction)",si:"SI \xa7S6.C\u2013D",sub:"\u03bc\u0302_i ~ N(\u03bc_model,i, c\u2080\xb7\u03bc_svf,i/L_i + \u03c3\u00b2_meas)",tg:[["t-th","CLT"],["t-re","Dual-Line"]],
ss:[{title:"CLT Model (see SI \xa7S6.C)",cl:"#db2777",it:[
 {label:"Normal Convergence",eq:"\\hat\\mu_i\\sim\\mathcal{N}\\!\\bigl(\\mu_{\\mathrm{model},i},\\;c_0\\,\\mu_{\\mathrm{svf},i}/L_i+\\sigma_{\\mathrm{meas}}^2\\bigr)",text:"N ~ L/\u2113_corr ~ 10\u2075 independent encounters; CLT guarantees cumulative log-energy change converges to Normal. \u03bc_model = \u03bc_svf + \u03bc_Dore = 2\u03bc_E + \u03bc_v. Mean and variance both fixed by the same Green\u2013Kubo kernel \u2014 zero free scatter parameters. c\u2080 = 1 is the structural baseline."},
]},{title:"Dual-Line Structure and Observable Consequences",cl:"#db2777",it:[
 {label:"Line 1 (Mean \u2192 Fig 4 Test)",text:"\u03bc_E(\u03c9) = C_tot \u03b5^{2/3} g^{-7/3} \u03c9^{8/3}. Observable mean \u03bc_model = 2\u03bc_E + \u03bc_Dore. Ensemble-level magnitude, frequency scaling, spatial pattern. \u03b2 = C_tot/(2\u03c0/3) = 1 is the zero-parameter prediction."},
 {label:"Line 2 (Distribution \u2192 Fig 5 Test)",text:"Full conditional distribution N(\u03bc_model, c\u2080\xb7\u03bc_svf/L + \u03c3\u00b2_meas). Locked by FDR-II, no independent scatter parameter. c\u2080 = 1 is the structural baseline. Along-ray correlations renormalise c\u2080 to \u211b, but the first moment is unaffected."},
 {label:"Negative Attenuation Rates (Zero-Parameter Prediction)",eq:"P(\\hat\\mu<0)=\\Phi(-\\mathcal{S}),\\quad \\mathcal{S}=\\mu_{\\mathrm{model}}/\\sigma_{\\mathrm{tot}}\\sim\\mathcal{O}(1)",text:"13\u201327% of trans-oceanic tracks predicted to show apparent negative attenuation \u2014 not noise, but an intrinsic prediction of the multiplicative random walk. S ~ O(1) means signal-to-noise is only order unity on typical trans-oceanic paths."},
]}]},

{id:"f4",n:"14",cl:"#dc2626",title:"Ensemble Validation (Fig. 4)",si:"Main text \xa75",sub:"Global maps + PDF + Wilcoxon (p = 0.816) + Amplitude independence",tg:[["t-re","Ensemble"]],
ss:[{title:"Test Results",cl:"#dc2626",it:[
 {label:"Magnitude and Bias",text:"Both \u03bc_model and \u03bc_obs at ~10\u207b\u2077 m\u207b\u00b9. Paired Wilcoxon test p = 0.816 (no systematic bias). 241 trans-oceanic tracks."},
 {label:"Amplitude Independence (Purest Structural Test)",text:"r = 0.00, p = 0.98. Green\u2013Kubo coefficient \u0393 is independent of wave amplitude (E_k cancels in the force autocorrelation factorisation \u27e8FF*\u27e9 = 2E_k \xb7 G_k). Satellite H_s dynamic range spans factor of 14 (in H_s\u00b2), with no detectable amplitude dependence. This rules out all amplitude-dependent empirical source terms (e.g. \u03bc \u221d H_s\u00b2)."},
]}]},

{id:"f5",n:"15",cl:"#dc2626",title:"Pathwise Validation (Fig. 5)",si:"Main text \xa76",sub:"Neg. rate vs L, \u03c9 + \u03b2 MLE [0.95, 1.64] + Reliability diagram + Budget",tg:[["t-re","Pathwise"]],
ss:[{title:"Test Results",cl:"#dc2626",it:[
 {label:"Negative Rate vs L and \u03c9",text:"Longer paths \u2192 larger S \u2192 lower negative rate (vs L); higher frequency \u2192 larger \u03bc \u2192 lower negative rate (vs \u03c9). Both quantitatively consistent with zero-parameter curves. Frequency dependence is an independent verification of \u03c9^{8/3} \u2014 tested through the distribution rather than the mean."},
 {label:"\u03b2 Profile Likelihood",text:"\u03b2_MLE = 1.30, 95% CI [0.95, 1.64]. Zero-parameter prediction \u03b2 = 1 lies within the 95% CI. The theoretical \u03b2 range [0.53, 1.59] (corresponding to C_tot \u2208 [1.10, 3.34] via \u03b2 = C_tot/(2\u03c0/3)) also contains \u03b2 = 1. Including Dore laminar viscous contribution (~13\u201321% of total) shifts \u03b2_MLE closer to unity. Joint profiling over (\u03b2, c\u2080, \u03c3_meas) keeps \u03b2 = 1 within CI (see Extended Data Fig. 8)."},
 {label:"Reliability Diagram and Coverage",text:"At c\u2080 = 1: 1\u03c3/2\u03c3 coverage 76%/94% (nominal 68%/95%). At c\u2080,MLE = 0.78: 73%/94%. Predicted variance explains most of observed scatter. PIT histogram approximately uniform."},
]},{title:"Fig 4 + Fig 5 Complementarity",cl:"#dc2626",it:[
 {label:"Both Layers Indispensable",text:"Fig 4 = ensemble mean level (\u03b2 = 1 test). Fig 5 = conditional distribution level (c\u2080 = 1 closure test). Five independent test lines: ensemble-mean magnitude, global spatial pattern, negative fraction vs path length, negative fraction vs frequency, predictive coverage. \u2018Zero free parameters\u2019 refers to the forward mean prediction \u03bc_E(\u03c9); fitted \u03b2_MLE, c\u2080,MLE, \u03c3_meas appear only in validation/diagnostic profiling, not in generating the theory curve."},
]}]},
];

var openNode=null,openSubs={},openItems={};
function buildChain(){var b=document.getElementById('chainBar');b.innerHTML='';CHAIN.forEach(function(nm,i){var s=document.createElement('span');s.className='c-node';s.textContent=nm;s.onclick=function(){openNode=NODES[i].id;render();setTimeout(function(){var el=document.getElementById('node-'+NODES[i].id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},50)};b.appendChild(s);if(i<CHAIN.length-1){var a=document.createElement('span');a.className='c-arr';a.textContent='\u2192';b.appendChild(a)}})}
function buildStats(){var b=document.getElementById('statsBar');b.innerHTML='';STATS.forEach(function(s){var d=document.createElement('div');d.className='stat';d.innerHTML='<div class="stat-n" style="color:'+s.c+'">'+s.n+'</div><div class="stat-l">'+s.l+'</div>';b.appendChild(d)})}
function buildLegend(){var b=document.getElementById('legendBar');b.innerHTML='';LEG.forEach(function(d){var s=document.createElement('span');s.className='tag '+d[0];s.textContent=d[1];b.appendChild(s)})}
function renderItem(item,nid,si,ii,color){var key=nid+'-'+si+'-'+ii;var div=document.createElement('div');var hdr=document.createElement('div');hdr.className='si-hdr';hdr.innerHTML='<div class="si-dot" style="background:'+color+'"></div><span class="si-label">'+item.label+'</span><span class="si-chev'+(openItems[key]?' open':'')+'">&#9654;</span>';hdr.onclick=function(e){e.stopPropagation();openItems[key]=!openItems[key];render()};div.appendChild(hdr);if(openItems[key]){var body=document.createElement('div');body.className='si-body';if(item.eq){var eqDiv=document.createElement('div');eqDiv.className='eq-block';body.appendChild(eqDiv);setTimeout(function(){try{katex.render(item.eq,eqDiv,{displayMode:true,throwOnError:false})}catch(e){eqDiv.textContent=item.eq}},0)}if(item.text){var p=document.createElement('div');if(item.warn)p.className='warn-block';else if(item.note)p.className='note-block';p.textContent=item.text;p.style.marginTop='4px';body.appendChild(p)}div.appendChild(body)}return div}
function renderSub(sub,nid,si){var key=nid+'-'+si;var div=document.createElement('div');var hdr=document.createElement('div');hdr.className='ss-hdr'+(openSubs[key]?' open':'');hdr.innerHTML='<div class="ss-title"><div class="ss-bar" style="background:'+sub.cl+'"></div><span style="color:'+(openSubs[key]?sub.cl:'var(--text)')+'">'+sub.title+'</span><span class="ss-chev'+(openSubs[key]?' open':'')+'">&#9660;</span></div>';hdr.onclick=function(e){e.stopPropagation();openSubs[key]=!openSubs[key];render()};div.appendChild(hdr);if(openSubs[key]){var body=document.createElement('div');body.className='ss-body';sub.it.forEach(function(item,i){body.appendChild(renderItem(item,nid,si,i,sub.cl))});div.appendChild(body)}return div}
function renderNode(node,idx){var isOpen=openNode===node.id;var wrap=document.createElement('div');wrap.className='node';wrap.id='node-'+node.id;var hdr=document.createElement('div');hdr.className='n-hdr'+(isOpen?' open':'');var tagHtml=node.tg.map(function(t){return'<span class="tag '+t[0]+'">'+t[1]+'</span>'}).join('');tagHtml+='<span class="tag t-in">'+node.si+'</span>';hdr.innerHTML='<div class="n-num" style="background:'+node.cl+'">'+node.n+'</div><div style="flex:1;min-width:0"><div class="n-title">'+node.title+'</div><div class="n-sub">'+node.sub+'</div><div class="n-tags">'+tagHtml+'</div></div><span class="chev'+(isOpen?' open':'')+'">&#9660;</span>';hdr.onclick=function(){openNode=isOpen?null:node.id;render()};wrap.appendChild(hdr);if(isOpen){var body=document.createElement('div');body.className='n-body open';node.ss.forEach(function(sub,i){body.appendChild(renderSub(sub,node.id,i))});wrap.appendChild(body)}if(idx<NODES.length-1){var conn=document.createElement('div');conn.className='conn';conn.innerHTML='<div class="conn-line" style="background:'+node.cl+'55"></div>';wrap.appendChild(conn)}return wrap}
function render(){buildChain();buildStats();buildLegend();var flow=document.getElementById('flow');flow.innerHTML='';NODES.forEach(function(node,i){flow.appendChild(renderNode(node,i))})}
render();
</script>
</body>
</html>
