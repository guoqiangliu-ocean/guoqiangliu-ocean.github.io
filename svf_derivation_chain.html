<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVF Theory — Derivation Architecture</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
:root {
  --bg: #fafbfc; --card: #ffffff; --card-hover: #f8f9fb;
  --border: #e2e8f0; --border2: #cbd5e1;
  --text: #1e293b; --text2: #475569; --text3: #94a3b8;
  --accent: #2563eb; --accent2: #7c3aed; --green: #059669;
  --amber: #d97706; --pink: #db2777; --red: #dc2626;
  --eq-bg: #f1f5f9; --eq-border: #cbd5e1;
  --note-bg: #eff6ff; --note-border: #93c5fd;
  --warn-bg: #fffbeb; --warn-border: #fcd34d;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Source Han Sans SC','Noto Sans SC','Helvetica Neue',system-ui,sans-serif;line-height:1.75;font-size:14px}
.hdr{text-align:center;padding:48px 20px 32px;border-bottom:1px solid var(--border);background:#fff}
.hdr h1{font-size:1.7em;font-weight:800;color:var(--text);margin-bottom:6px}
.hdr .sub{font-size:.92em;color:var(--text2);max-width:640px;margin:0 auto 16px}
.lang-btn{position:absolute;top:16px;right:20px;padding:5px 14px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--text2);cursor:pointer;font-size:12px;font-weight:600;transition:all .2s}
.lang-btn:hover{border-color:var(--accent);color:var(--accent)}
.chain{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;font-size:11px;font-family:'SF Mono',Consolas,monospace}
.chain span{padding:2px 7px;border-radius:4px;cursor:pointer;transition:all .15s}
.chain .c-node{background:#f1f5f9;border:1px solid #e2e8f0;color:var(--text2)}
.chain .c-node:hover{background:#dbeafe;border-color:#93c5fd;color:var(--accent)}
.chain .c-arr{color:#cbd5e1;border:none;background:none}
.main{max-width:880px;margin:0 auto;padding:28px 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-bottom:20px}
.stat{text-align:center;padding:12px 8px;background:#fff;border:1px solid var(--border);border-radius:8px}
.stat-n{font-family:'SF Mono',Consolas,monospace;font-size:1.6em;font-weight:800}
.stat-l{font-size:10.5px;color:var(--text2);margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px;margin-bottom:22px;background:#fff;border-radius:8px;border:1px solid var(--border)}
.tag{font-size:10.5px;padding:2px 8px;border-radius:999px;font-family:'SF Mono',Consolas,monospace;white-space:nowrap;font-weight:500}
.t-id{background:#dbeafe;color:#1d4ed8;border:1px solid #93c5fd}
.t-th{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
.t-as{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.t-in{background:#fce7f3;color:#9d174d;border:1px solid #f9a8d4}
.t-re{background:#ede9fe;color:#5b21b6;border:1px solid #c4b5fd}
.node{margin-bottom:2px;position:relative}
.node::before{content:'';position:absolute;left:23px;top:52px;bottom:-2px;width:2px;background:var(--border)}
.node:last-child::before{display:none}
.n-hdr{display:flex;align-items:center;gap:12px;padding:11px 16px;background:#fff;border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s;position:relative;z-index:1}
.n-hdr:hover{border-color:var(--border2);box-shadow:0 1px 4px rgba(0,0,0,.05)}
.n-hdr.open{border-radius:10px 10px 0 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.n-num{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'SF Mono',Consolas,monospace;font-weight:800;font-size:13px;color:#fff;flex-shrink:0}
.n-title{font-weight:700;font-size:14px;margin-bottom:1px}
.n-sub{font-size:11.5px;color:var(--text2);font-family:'SF Mono',Consolas,monospace}
.n-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.chev{font-size:12px;color:var(--text3);transition:transform .25s;flex-shrink:0}
.chev.open{transform:rotate(180deg)}
.n-body{display:none;background:#fff;border:1px solid var(--border2);border-top:none;border-radius:0 0 10px 10px;padding:16px 20px}
.n-body.open{display:block}
.ss-hdr{padding:8px 12px;border-radius:6px;cursor:pointer;border:1px solid transparent;transition:all .15s;margin-bottom:2px}
.ss-hdr:hover{background:#f8fafc;border-color:#e2e8f0}
.ss-hdr.open{background:#f1f5f9;border-color:#cbd5e1}
.ss-title{font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px}
.ss-bar{width:3px;height:13px;border-radius:2px;flex-shrink:0}
.ss-chev{margin-left:auto;font-size:9px;color:var(--text3);transition:transform .2s}
.ss-chev.open{transform:rotate(180deg)}
.ss-body{padding:4px 4px 4px 20px;margin-left:13px;border-left:2px solid #e2e8f0}
.si-hdr{padding:6px 10px;border-radius:5px;cursor:pointer;transition:background .15s;display:flex;align-items:center;gap:7px}
.si-hdr:hover{background:#f8fafc}
.si-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.si-label{font-weight:600;font-size:12.5px;color:var(--text)}
.si-chev{margin-left:auto;font-size:9px;color:var(--text3);transition:transform .2s}
.si-chev.open{transform:rotate(90deg)}
.si-body{padding:6px 10px 8px 22px;font-size:12.5px;color:var(--text2);line-height:1.8;margin-left:2px;border-left:2px solid #f1f5f9}
.eq-block{background:var(--eq-bg);border-left:3px solid var(--accent);padding:8px 14px;border-radius:0 6px 6px 0;margin:6px 0;overflow-x:auto}
.note-block{background:var(--note-bg);border-left:3px solid var(--note-border);padding:7px 12px;border-radius:0 6px 6px 0;margin:6px 0;font-size:12px}
.warn-block{background:var(--warn-bg);border-left:3px solid var(--warn-border);padding:7px 12px;border-radius:0 6px 6px 0;margin:6px 0;font-size:12px}
.conn{text-align:center;padding:2px 0;position:relative;z-index:1}
.conn-line{width:2px;height:18px;margin:0 auto;border-radius:1px}
@media(max-width:640px){.hdr h1{font-size:1.3em}.n-hdr{padding:8px 10px;gap:8px}.n-num{width:34px;height:34px;font-size:11px}}
</style>
</head>

var NODES = [
{id:"ns",n:"01",cl:"#2563eb",

 st_en:"Incompressible NS · Boussinesq · Exact starting point",

{id:"hlm",n:"02",cl:"#2563eb",

 ]}]},

{id:"3ly",n:"04",cl:"#2563eb",
 t_zh:"三层涡度分解 → CL + SVF",t_en:"Three-Layer Vorticity → CL + SVF",si:"SI §S1.C–E Eq.S.24–44",
 st_zh:"ω = Ω̄ + ω' + ω_wave · 三通道排除 → SVF 为唯一不可逆通道",
 st_en:"ω = Ω̄ + ω' + ω_wave · Three-channel exclusion → SVF is the sole irreversible channel",
 tg:[["t-id","精确分解","Exact"],["t-as","A1–A2","A1–A2"]],
 ss:[{t_zh:"McWilliams 三层分解",t_en:"McWilliams Three-Layer Decomposition",cl:"#2563eb",it:[
  {l_zh:"三层结构",l_en:"Three Layers",
   eq:"\\boldsymbol{\\omega}=\\bar{\\boldsymbol{\\Omega}}+\\boldsymbol{\\omega}'+\\boldsymbol{\\omega}_{\\mathrm{wave}}",
   x_zh:"Ω̄ = 系综平均涡度；ω' = 湍流涡度涨落（⟨ω'⟩ = 0）；ω_wave = 波动奴役涡度（≈ ∇×(ξ×Ω_s)，无独立自由度）。两次平均操作：相位平均分离 ω_wave，系综平均分离 Ω̄ 和 ω'。",
   x_en:"Ω̄ = ensemble-mean vorticity; ω' = turbulent fluctuation (⟨ω'⟩=0); ω_wave ≈ ∇×(ξ×Ω_s) wave-slaved, no independent DOF. Two averaging operations: phase average separates ω_wave; ensemble average separates Ω̄ and ω'."},
 ]},{t_zh:"三通道排除 → SVF 唯一性",t_en:"Three-Channel Exclusion → SVF Uniqueness",cl:"#7c3aed",it:[
  {l_zh:"Term I: u_φ × Ω̄ → 保守",l_en:"Term I: u_φ × Ω̄ → Conservative",
   x_zh:"Ω̄ 无内部自由度（单一确定向量）。每个波周期的做功在下半周期精确返回。零净耗散（仅保守频移）。",
   x_en:"Ω̄ has no internal DOF. Work done each half-cycle is exactly returned. Zero net dissipation (conservative frequency shift only)."},
  {l_zh:"Term II: u_φ × ω_wave → 保守",l_en:"Term II: u_φ × ω_wave → Conservative",

   x_en:"ω_wave is wave-slaved with no independent DOF. Product has spectral support at 0 (=CL force, modifies mean flow without damping waves) and 2ω (no projection onto swell mode). Conservative w.r.t. wave amplitude."},

   x_en:"ω' possesses internal DOF (full turbulent cascade) — eddies redistribute received energy to smaller scales within one wave period, erasing phase information needed for exact return. Combined with spatial decorrelation (wave packet traverses independent turbulent regions), this is the only component with both irreversibility ingredients.",

  {l_zh:"SVF 定义 (Eq.S.37)",l_en:"SVF Definition (Eq.S.37)",
   eq:"\\boldsymbol{f}_{\\mathrm{svf}}\\equiv\\boldsymbol{u}_\\phi\\times\\boldsymbol{\\omega}'",
   x_zh:"相位平均为零（经典理论因此将其丢弃），但自相关非零。耗散由力的二阶统计量（自相关）决定，不由一阶统计量（均值）决定。这就是经典框架遗漏它的原因。",
   x_en:"Phase average is zero (classical theory discards it). But its autocorrelation is nonzero. Dissipation is determined by second-order statistics (autocorrelation), not first-order (mean). This is why the classical framework missed it."},
 ]},{t_zh:"假设 A1–A2",t_en:"Assumptions A1–A2",cl:"#d97706",it:[
  {l_zh:"A1 (线性波动)",l_en:"A1 (Linear Waves)",

  {l_zh:"A2 (时间尺度分离)",l_en:"A2 (Timescale Separation)",
   eq:"\\tau_c\\sim\\ell/c_g\\sim 5\\,\\mathrm{s}\\;\\ll\\;\\Gamma^{-1}\\sim 10^5\\text{--}10^6\\,\\mathrm{s}",
   x_zh:"分离度 ~10⁴。A2 不需要来证明 Γ ≥ 0（Bochner 定理独立保证），但需要来将 Green–Kubo 系数解释为指数衰减率。",
   x_en:"Separation ratio ~10⁴. A2 is not needed for Γ ≥ 0 (guaranteed by Bochner alone), but is needed to interpret the Green–Kubo coefficient as an exponential decay rate."},
 ]}]},

{id:"mz",n:"05",cl:"#7c3aed",
 t_zh:"Mori–Zwanzig 投影",t_en:"Mori–Zwanzig Projection",si:"SI §S2.D–E",
 st_zh:"慢变量 a_k · 热浴 ω' · 正交投影 Q → F_k",
 st_en:"Slow variable a_k · Bath ω' · Orthogonal projection Q → F_k",

 ss:[{t_zh:"投影框架",t_en:"Projection Framework",cl:"#7c3aed",it:[

   x_en:"Slow: swell amplitude a_k(t) (timescale ~ Γ⁻¹ ~ 10⁶ s). Fast/bath: ω'(x,t) (correlation ~ τ_c ~ 5 s). Ratio ~ 10⁵. MZ projection is an exact operator identity — no approximation, just a rewriting."},
 ]},{t_zh:"假设 A3 — 整条链最关键的假设",t_en:"Assumption A3 — Most Critical in the Entire Chain",cl:"#d97706",it:[
  {l_zh:"A3(i) 平稳性",l_en:"A3(i) Stationarity",
   x_zh:"ω' 处于非平衡稳态（NESS），统计量时不变。混合层由持续风应力驱动，处于动态平衡。",
   x_en:"ω' is in a non-equilibrium steady state (NESS), time-translationally invariant. Mixed layer is in dynamic equilibrium under sustained wind forcing."},
  {l_zh:"A3(ii) 相位独立 ⚠",l_en:"A3(ii) Phase Independence ⚠",
   x_zh:"涌浪相位 θ_k 与湍流涡度 ω' 统计独立。物理论据：远场涌浪源自 ~10⁴ km 外风暴，与本地湍流（由本地风/破碎/浮力驱动）无因果关系。但对局地风浪不成立——这精确定义了理论的适用边界。",
   x_en:"Swell phase θ_k is statistically independent of ω'. Physical basis: remote swell originates from storms ~10⁴ km away, causally disconnected from local turbulence. Fails for local wind waves — this precisely defines the theory's domain.",
   warn:true},
  {l_zh:"A4 (弱耦合)",l_en:"A4 (Weak Coupling)",
   eq:"\\delta\\equiv u'/c_g\\sim 10^{-3}\\text{--}10^{-2}\\ll 1",
   x_zh:"保证：单次遭遇 ΔE/E ~ δ ≪ 1；涌浪反作用可忽略（热浴近似）；Born–Markov 近似有效。",
   x_en:"Ensures: single encounter ΔE/E ~ δ ≪ 1; swell back-reaction negligible (bath approximation); Born–Markov valid."},
 ]}]},

{id:"gle",n:"06",cl:"#7c3aed",
 t_zh:"广义 Langevin 方程 (GLE)",t_en:"Generalised Langevin Equation (GLE)",si:"SI §S2.E–F",
 st_zh:"da_k/dt = iω a_k − ∫K a_k ds + F_k(t) · 乘性噪声",
 st_en:"da_k/dt = iω a_k − ∫K a_k ds + F_k(t) · Multiplicative noise",
 tg:[["t-re","MZ 精确输出","MZ Exact Output"]],
 ss:[{t_zh:"GLE 与乘性噪声",t_en:"GLE and Multiplicative Noise",cl:"#7c3aed",it:[
  {l_zh:"三项结构",l_en:"Three-Term Structure",
   eq:"\\frac{da_k}{dt}=i\\omega_k a_k-\\int_0^t K_k(t-s)\\,a_k(s)\\,ds+F_k(t)",
   x_zh:"自由振荡 + 记忆摩擦 + 随机力。K_k 和 F_k 都由 SVF 的统计性质完全确定，不是独立输入。",
   x_en:"Free oscillation + memory friction + random force. Both K_k and F_k are fully determined by SVF statistics, not independent inputs."},
  {l_zh:"乘性噪声的起源",l_en:"Origin of Multiplicative Noise",
   x_zh:"能量 E_k = |a_k|² 的噪声项 η = 2Re[a_k* F_k] 正比于 a_k · ω'——乘性的。这是因为 SVF 的双线性结构 f_svf = u_φ × ω'（其中 u_φ ∝ a_k）。这是 Itô 因子 2 的数学根源。",
   x_en:"Energy noise η = 2Re[a_k* F_k] is proportional to a_k · ω' — multiplicative. This follows from SVF's bilinear structure f_svf = u_φ × ω' (where u_φ ∝ a_k). This is the mathematical origin of the Itô factor of 2."},
 ]}]},

{id:"fdr",n:"07",cl:"#7c3aed",
 t_zh:"FDR-II（第二涨落-耗散关系）",t_en:"FDR-II (Second Fluctuation-Dissipation Relation)",si:"SI §S2.C Eq.S.50",
 st_zh:"K_k(τ) = ⟨F(0)F*(τ)⟩ / 2E_k · 不要求热平衡",
 st_en:"K_k(τ) = ⟨F(0)F*(τ)⟩ / 2E_k · No thermal equilibrium required",
 tg:[["t-id","精确关系","Exact"],["t-as","A3","A3"]],
 ss:[{t_zh:"FDR-II 的证明",t_en:"Proof of FDR-II",cl:"#059669",it:[
  {l_zh:"公式",l_en:"Formula",
   eq:"K_{\\boldsymbol{k}}(\\tau)=\\frac{\\langle F_{\\boldsymbol{k}}(0)\\,F_{\\boldsymbol{k}}^*(\\tau)\\rangle}{\\langle|a_{\\boldsymbol{k}}|^2\\rangle}",
   x_zh:"将摩擦核（K）与噪声力自相关（F）锁定在一起。证明仅需：(i) P 的自伴性（正交投影的构造性质）；(ii) ρ_ss 下相关函数的时间平移不变性（仅需稳态，不需详细平衡或 Liouville 算子自伴性）。",
   x_en:"Locks the friction kernel (K) to the noise autocorrelation (F). Proof requires only: (i) self-adjointness of P (by construction); (ii) time-translation invariance under ρ_ss (only stationarity, no detailed balance or Liouville self-adjointness)."},
  {l_zh:"非平衡适用性",l_en:"Non-Equilibrium Applicability",
   x_zh:"海洋混合层 = 机械驱动 NESS（非热平衡）。Evans & Morriss (2008)、Marconi et al. (2008) 建立了非平衡 FDR 的完整理论。Han et al. (2021, Nature Physics) 在手征活性流体中实验验证了非平衡 Green–Kubo 关系。",
   x_en:"Ocean mixed layer = mechanically driven NESS (not thermal equilibrium). Evans & Morriss (2008), Marconi et al. (2008) established non-equilibrium FDR theory. Han et al. (2021, Nature Physics) experimentally verified non-equilibrium Green–Kubo in chiral active fluids."},
 ]},{t_zh:"物理核心含义",t_en:"Core Physical Meaning",cl:"#7c3aed",it:[
  {l_zh:"Einstein 类比",l_en:"Einstein Analogy",
   x_zh:"如同 D = kT/(6πηa) 将扩散（噪声）和摩擦锁定为同源：SVF 理论中，均值 μ_E 和方差 σ²(μ̂) 由同一个 F_k 自相关确定。这是双线预测结构的数学根基——不需要独立的散射参数。",
   x_en:"Just as D = kT/(6πηa) locks diffusion (noise) and friction to a common source: in SVF theory, mean μ_E and variance σ²(μ̂) are both determined by the same F_k autocorrelation. This is the mathematical foundation of the dual-line prediction — no independent scatter parameter needed."},
 ]}]},

{id:"gk",n:"08",cl:"#059669",
 t_zh:"Green–Kubo 公式 + Bochner 定理",t_en:"Green–Kubo Formula + Bochner's Theorem",si:"SI §S2.E Eq.S.53–59",
 st_zh:"Γ(k) ≥ 0 由 Bochner 定理保证 · H 定理",
 st_en:"Γ(k) ≥ 0 guaranteed by Bochner · H-theorem",
 tg:[["t-th","Bochner → Γ≥0","Bochner → Γ≥0"],["t-re","H 定理","H-theorem"]],
 ss:[{t_zh:"Green–Kubo 系数",t_en:"Green–Kubo Coefficient",cl:"#059669",it:[
  {l_zh:"Markov 极限",l_en:"Markov Limit",
   eq:"\\Gamma(\\boldsymbol{k})=\\frac{1}{2E_{\\boldsymbol{k}}}\\int_0^\\infty\\!\\operatorname{Re}\\bigl\\langle F_{\\boldsymbol{k}}(0)\\,F_{\\boldsymbol{k}}^*(\\tau)\\bigr\\rangle\\,d\\tau\\;\\geq\\;0",
   x_zh:"在 A2（τ_c ≪ Γ⁻¹）下，记忆积分退化为局域摩擦。这不是涡粘拟合——是波-湍流耦合系统对 SVF 涨落的精确线性响应。",
   x_en:"Under A2 (τ_c ≪ Γ⁻¹), memory integral reduces to local friction. Not an eddy-viscosity fit — exact linear response of the wave-turbulence system to SVF fluctuations."},
  {l_zh:"Bochner 定理 → Γ ≥ 0",l_en:"Bochner's Theorem → Γ ≥ 0",
   x_zh:"F_k(t) 是平稳过程 ⇒ 功率谱 S_F(ω) ≥ 0（Bochner 1933）。GK 积分 = S_F(0)/2 ≥ 0。因此 Γ ≥ 0 不是假设，是数学定理。",
   x_en:"F_k(t) stationary ⇒ power spectrum S_F(ω) ≥ 0 (Bochner 1933). GK integral = S_F(0)/2 ≥ 0. Thus Γ ≥ 0 is a theorem, not an assumption."},
 ]},{t_zh:"H 定理与不可逆性机制",t_en:"H-Theorem and Irreversibility Mechanism",cl:"#059669",it:[
  {l_zh:"涌浪子空间 H 定理",l_en:"Swell-Subspace H-Theorem",
   eq:"\\frac{d\\langle E_w\\rangle}{dt}=-2\\Gamma\\langle E_w\\rangle\\leq 0",
   x_zh:"结构等同于 Boltzmann H 定理：宏观不可逆性从微观可逆动力学涌现，因为湍流热浴的自由度远多于涌浪子空间。",
   x_en:"Structurally identical to Boltzmann's H-theorem: macroscopic irreversibility emerges from microscopically reversible dynamics because the turbulent bath has far more DOF than the swell subspace."},
  {l_zh:"单阀门机制",l_en:"One-Way Valve Mechanism",
   x_zh:"每次遭遇中能量交换近似对称（波可加速或减速涡旋）。但涡旋立即通过 Kolmogorov 级联将能量重分配到更小尺度，擦除精确返回所需的相位信息。能量可进入湍流连续谱；不能自发重组为涌浪频率和相位的窄带力。",
   x_en:"Each encounter has nearly symmetric energy exchange. But eddies immediately redistribute energy to smaller scales via the Kolmogorov cascade, erasing phase information needed for exact return. Energy enters the turbulent continuum; it cannot spontaneously reorganise into a narrow-band force at the swell frequency and phase."},
 ]}]},

{id:"kol",n:"09",cl:"#db2777",
 t_zh:"Kolmogorov 惯性子区谱（唯一经验输入）",t_en:"Kolmogorov Inertial Subrange (Sole Empirical Input)",si:"SI §S3–S4, §S5.H",
 st_zh:"E(q) = C_K ε^{2/3} q^{-5/3} · 六十年实验支撑",
 st_en:"E(q) = C_K ε^{2/3} q^{-5/3} · Six decades of experimental support",
 tg:[["t-in","独立实验","Independent Expt"],["t-as","A5","A5"]],
 ss:[{t_zh:"谱的输入",t_en:"Spectral Input",cl:"#db2777",it:[
  {l_zh:"Kolmogorov 谱",l_en:"Kolmogorov Spectrum",
   eq:"E_\\omega(q)=q^2 E_u(q)=C_K\\,\\varepsilon^{2/3}\\,q^{1/3}",
   x_zh:"E_u(q) = C_K ε^{2/3} q^{-5/3}（速度谱），E_ω = q² E_u（涡度谱多一个 q² 因子）。C_K ≈ 1.5 为 Kolmogorov 常数，由独立湍流实验确定。",
   x_en:"E_u(q) = C_K ε^{2/3} q^{-5/3} (velocity), E_ω = q²E_u (vorticity has extra q²). C_K ≈ 1.5 from independent turbulence experiments."},
  {l_zh:"适用性：各向异性分层湍流",l_en:"Validity: Anisotropic Stratified Turbulence",
   x_zh:"涌浪选择的尺度 q ~ k ~ 0.01–0.03 rad/m（逆波数 ~30–80 m）落在各向异性分层湍流区间。理论只需要水平涡度谱遵循 -5/3——不需要各向同性。Kunze (2019)、Klymak & Moum (2007) 支持。",
   x_en:"Swell-selected scales q ~ k ~ 0.01–0.03 rad/m (inverse wavenumbers ~30–80 m) lie in the anisotropic stratified regime. Theory only requires horizontal vorticity spectrum to follow -5/3 — isotropy not needed. Supported by Kunze (2019), Klymak & Moum (2007)."},
 ]},{t_zh:"假设 A5",t_en:"Assumption A5",cl:"#d97706",it:[
  {l_zh:"A5 (惯性子区谱形式)",l_en:"A5 (Inertial-Subrange Spectral Form)",
   x_zh:"在涌浪选择的波数区间 q ~ k 内，水平涡度谱遵循 Kolmogorov −5/3 幂律。这是理论的唯一经验输入——不是拟合涌浪数据，而是由六十年独立湍流实验（大气、海洋、实验室）确定的普适标度。不要求完全各向同性，仅要求水平分量的谱斜率。适用范围由局部 Ozmidov 尺度 L_O = (ε/N³)^{1/2} 和 Kolmogorov 尺度 η_K = (ν³/ε)^{1/4} 界定。",
   x_en:"Within the swell-selected wavenumber band q ~ k, the horizontal vorticity spectrum follows the Kolmogorov −5/3 power law. This is the theory's sole empirical input — not fitted to swell data, but established by six decades of independent turbulence experiments (atmosphere, ocean, laboratory). Full isotropy is not required; only the spectral slope of the horizontal component. Validity bounded by the local Ozmidov scale L_O = (ε/N³)^{1/2} and Kolmogorov scale η_K = (ν³/ε)^{1/4}.",
   warn:true},
 ]}]},

{id:"fk",n:"10",cl:"#d97706",
 t_zh:"SVF 力核积分（力自相关的解析计算）",t_en:"SVF Force Kernel (Analytical Force Autocorrelation)",si:"SI §S3–S4 Eq.S.60–78",
 st_zh:"角度积分 → 几何核 W(q/k) · 频率积分 → τ_eff · C_τ = 1",
 st_en:"Angular integral → Geometric kernel W(q/k) · Frequency integral → τ_eff · C_τ = 1",
 tg:[["t-re","解析积分","Analytical"]],
 ss:[{t_zh:"力自相关的波数空间计算",t_en:"Force Autocorrelation in Wavenumber Space",cl:"#d97706",it:[
  {l_zh:"力核的谱表示",l_en:"Spectral Representation of Force Kernel",
   x_zh:"将 Green–Kubo 积分展开到波数-频率空间：Γ(k) = ∫d³q |V(k,q)|² E_ω(q) / (2 q c_g)。|V|² 是涡力顶角（vertex），E_ω 是涡度谱，1/(qc_g) 来自平流去相关。物理含义：只有与涌浪在波数和频率上同时匹配的涡度模态才能有效耦合。",
   x_en:"Green–Kubo integral expanded in wavenumber-frequency space: Γ(k) = ∫d³q |V(k,q)|² E_ω(q)/(2qc_g). |V|² is the vortex-force vertex, E_ω is the vorticity spectrum, 1/(qc_g) from advective decorrelation. Only vorticity modes matching swell in both wavenumber and frequency couple effectively."},
  {l_zh:"几何核（尺度选择窗）",l_en:"Geometric Kernel (Scale-Selection Window)",
   eq:"\\mathcal{W}(\\eta)=\\frac{\\eta^2}{(1+\\eta^2)^2},\\quad\\eta=q/k",
   x_zh:"在 η ~ 1（q ~ k）处取极大值。主导耦合发生在湍流尺度 ≈ 波动尺度：ℓ ~ k⁻¹ ~ 56 m（对 14 s 涌浪）。[k/2, 2k] 区间贡献约 58–66% 的总衰减。",
   x_en:"Peaks at η ~ 1 (q ~ k). Dominant coupling occurs at turbulence scale ≈ wave scale: ℓ ~ k⁻¹ ~ 56 m (for 14 s swell). The band [k/2, 2k] accounts for ~58–66% of total attenuation."},
 ]},{t_zh:"频率积分与 C_τ",t_en:"Frequency Integral and C_τ",cl:"#d97706",it:[
  {l_zh:"有效平流去相关时间",l_en:"Effective Advective Decorrelation Time",
   eq:"\\tau_{\\mathrm{eff}}=\\frac{C_\\tau}{q\\,c_g}\\sim 5\\,\\mathrm{s}\\;\\ll\\;\\tau_{\\mathrm{eddy}}\\sim(\\varepsilon q^2)^{-1/3}\\sim 10^3\\,\\mathrm{s}",
   x_zh:"波能轨迹穿越一个涡旋相关长度的时间。波包以 c_g ~ 10 m/s 前进，涡旋以 u' ~ 0.01 m/s 运动——波包在涡旋几乎不动的情况下穿过它。C_τ ∈ [0.89, 1.25]，基准取 C_τ = 1。",
   x_en:"Time for the wave-energy trajectory to traverse one eddy correlation length. Wave packet advances at c_g ~ 10 m/s while eddy moves at u' ~ 0.01 m/s — wave packet passes through the nearly frozen eddy. C_τ ∈ [0.89, 1.25], baseline C_τ = 1."},
 ]}]},

{id:"law",n:"11",cl:"#059669",
 t_zh:"解析标度律（零参数预测）",t_en:"Analytical Scaling Law (Zero-Parameter Prediction)",si:"SI §S4–S5 Eq.S.79",
 st_zh:"μ_E(ω) = C_tot ε^{2/3} g^{-7/3} ω^{8/3}",
 st_en:"μ_E(ω) = C_tot ε^{2/3} g^{-7/3} ω^{8/3}",
 tg:[["t-re","零参数","Zero-Param"]],
 ss:[{t_zh:"标度律推导",t_en:"Derivation of Scaling Law",cl:"#059669",it:[
  {l_zh:"核心结果",l_en:"Core Result",
   eq:"\\mu_E(\\omega)=C_{\\mathrm{tot}}\\,\\varepsilon_{\\mathrm{eff}}^{2/3}\\,g^{-7/3}\\,\\omega^{8/3}",
   x_zh:"将 Kolmogorov 涡度谱代入力核积分，所有积分解析可做。8/3 指数来源：Γ ∝ k^{1/3}（来自 −5/3 谱 + 力核积分），μ = 2Γ/c_g ∝ k^{4/3}，深水色散 k = ω²/g → μ ∝ ω^{8/3}。",
   x_en:"Substituting Kolmogorov vorticity spectrum into the force kernel, all integrals evaluate analytically. Origin of 8/3: Γ ∝ k^{1/3} (from -5/3 spectrum + force kernel), μ = 2Γ/c_g ∝ k^{4/3}, deep-water dispersion k = ω²/g → μ ∝ ω^{8/3}."},
 ]},{t_zh:"C_tot = 2π/3 的五因子分解",t_en:"Five-Factor Decomposition: C_tot = 2π/3",cl:"#059669",it:[
  {l_zh:"分解公式",l_en:"Decomposition",
   eq:"C_{\\mathrm{tot}}=4\\cdot C_K\\cdot \\widetilde{G}_{\\mathrm{geom}}\\cdot C_{\\mathcal{S}}\\cdot C_\\tau\\cdot C_E=\\frac{2\\pi}{3}\\approx 2.094",
   x_zh:"4 = c_g⁻² 运动学因子；C_K ≈ 1.5 独立湍流实验；G̃_geom = 解析几何积分；C_S = 解析窗函数积分；C_τ = 1 基准去相关因子（范围 [0.89, 1.25]）；C_E = 混合层深度积分。所有系数由独立物理约束确定——无一拟合涌浪数据。C_tot ∈ [1.10, 3.34]（SI S5 Table S1）。",
   x_en:"4 = c_g⁻² kinematic factor; C_K ≈ 1.5 from independent turbulence experiments; G̃_geom = analytical geometric integral; C_S = analytical window integral; C_τ = 1 baseline decorrelation (range [0.89, 1.25]); C_E = mixed-layer depth integral. All fixed by independent constraints — none fitted to swell data. C_tot ∈ [1.10, 3.34] (SI S5 Table S1)."},
 ]}]},

{id:"ito",n:"12",cl:"#db2777",
 t_zh:"Itô 修正（2,2,1 结构常数）",t_en:"Itô Correction (2,2,1 Structural Constants)",si:"SI §S6.A–B Eq.S.200–215",
 st_zh:"⟨μ̂⟩ = 2μ_E · Var(μ̂) = 2μ_E/L · c₀ = 1",
 st_en:"⟨μ̂⟩ = 2μ_E · Var(μ̂) = 2μ_E/L · c₀ = 1",
 tg:[["t-re","精确常数","Exact Constants"],["t-re","观测修正","Obs. Correction"]],
 ss:[{t_zh:"遭遇级随机动力学",t_en:"Encounter-Level Stochastic Dynamics",cl:"#db2777",it:[
  {l_zh:"能量增量的均值与方差",l_en:"Mean and Variance of Energy Increment",
   x_zh:"ξ = ΔE/E：⟨ξ⟩ = −αδ²（衰减），Var(ξ) = β_ξ δ²（涨落）。FDR-II 精确锁定 α/β_ξ = 1/2——不依赖 δ、ℓ_corr 或 C_F(τ) 的具体函数形式。关键代数：FDR-II 给出 Γ = I_F/(2E_k)，导致 α ∝ 2Γ，β_ξ ∝ 4Γ，故 α = β_ξ/2。",
   x_en:"ξ = ΔE/E: ⟨ξ⟩ = −αδ² (decay), Var(ξ) = β_ξ δ² (fluctuation). FDR-II exactly locks α/β_ξ = 1/2 — independent of δ, ℓ_corr, or C_F(τ) form. Key algebra: FDR-II gives Γ = I_F/(2E_k), leading to α ∝ 2Γ, β_ξ ∝ 4Γ, hence α = β_ξ/2."},
 ]},{t_zh:"Itô 修正的推导（2,2,1 框架）",t_en:"Derivation of Itô Correction (2,2,1 Framework)",cl:"#db2777",it:[
  {l_zh:"因子 2 的来源",l_en:"Origin of Factor 2",
   eq:"\\Delta\\varepsilon=\\ln(1+\\xi)\\approx\\xi-\\tfrac{\\xi^2}{2}\\;\\Rightarrow\\;A=\\alpha+\\tfrac{1}{2}\\beta_\\xi=\\frac{\\beta_\\xi}{2}+\\frac{\\beta_\\xi}{2}=\\beta_\\xi",
   x_zh:"对数变换引入 Itô 修正。均值系数 A = α + β_ξ/2。代入 α = β_ξ/2，得 A = β_ξ。因此 ⟨μ̂⟩/μ_E = A/α = β_ξ/(β_ξ/2) = 2。回归估计量 μ̂ 的期望值 = 2μ_E。1/2 来自物理衰减 Γ，1/2 来自乘性噪声的 Itô 修正。",
   x_en:"Log transform introduces Itô correction. Mean coefficient A = α + β_ξ/2. Substituting α = β_ξ/2 gives A = β_ξ. Thus ⟨μ̂⟩/μ_E = A/α = β_ξ/(β_ξ/2) = 2. Regression estimator ⟨μ̂⟩ = 2μ_E. Half from physical damping Γ, half from the multiplicative-noise Itô correction."},
  {l_zh:"c₀ = 1",l_en:"c₀ = 1",
   eq:"c_0=\\frac{B}{A}=\\frac{\\beta_\\xi}{\\beta_\\xi}=1,\\qquad\\mathrm{Var}(\\hat\\mu)=\\frac{2\\mu_E}{L}",
   x_zh:"方差系数 B = β_ξ（对数变换不改变领阶方差）。c₀ = B/A = β_ξ/β_ξ = 1。2 和 1 都是精确结构常数，由 FDR-II 的 α = β_ξ/2 + 双线性耦合代数完全确定。不假设 C_F(τ) 的函数形式，不需要热平衡，不用 ad hoc 闭合。",
   x_en:"Variance coefficient B = β_ξ (log transform preserves leading-order variance). c₀ = B/A = β_ξ/β_ξ = 1. Both 2 and 1 are exact structural constants, fully determined by FDR-II's α = β_ξ/2 + bilinear coupling algebra. No assumption on C_F(τ) form, no thermal equilibrium, no ad hoc closure."},
 ]},{t_zh:"历史影响",t_en:"Historical Impact",cl:"#dc2626",it:[
  {l_zh:"所有卫星估计量 = 2μ_E",l_en:"All Satellite Estimators = 2μ_E",
   x_zh:"Snodgrass (1966) 到 Stopa (2016) 的所有基于 ln E 回归的卫星估计量测量的都是 2μ_E，不是 μ_E。一半的 log-slope 来自物理衰减，一半来自噪声诱导的几何漂移。60 年来第一次指出此系统因子。",
   x_en:"All ln E regression-based satellite estimators from Snodgrass (1966) to Stopa (2016) measure 2μ_E, not μ_E. Half of the log-slope comes from physical decay, half from noise-induced geometric drift. First identification of this systematic factor in 60 years."},
 ]}]},

{id:"clt",n:"13",cl:"#db2777",
 t_zh:"CLT → 单轨道完整分布（双线预测）",t_en:"CLT → Full Pathwise Distribution (Dual-Line Prediction)",si:"SI §S6 Eq.S.216",
 st_zh:"μ̂_i ~ N(μ_model,i, c₀·μ_svf,i/L_i + σ²_meas)",
 st_en:"μ̂_i ~ N(μ_model,i, c₀·μ_svf,i/L_i + σ²_meas)",
 tg:[["t-th","CLT","CLT"],["t-re","双线预测","Dual-Line"]],
 ss:[{t_zh:"CLT 模型",t_en:"CLT Model",cl:"#db2777",it:[
  {l_zh:"正态收敛",l_en:"Normal Convergence",
   eq:"\\hat\\mu_i\\sim\\mathcal{N}\\!\\bigl(\\mu_{\\mathrm{model},i},\\;c_0\\,\\mu_{\\mathrm{svf},i}/L_i+\\sigma_{\\mathrm{meas}}^2\\bigr)",
   x_zh:"N ~ L/ℓ_corr ~ 10⁵ 次独立遭遇，CLT 保证对数能量的累积变化渐近正态。μ_model = μ_svf + μ_Dore = 2μ_E + μ_v。均值和方差都由同一个 Green–Kubo 核确定——零个自由散射参数。c₀ = 1 为结构基准值。",

// ─── RENDERING ──────────────────────────────────────────
var openNode = null;
var openSubs = {};
var openItems = {};

function tx(zh,en){ return lang==='zh'?zh:en; }

function renderKatex(tex, el) {
  try { katex.render(tex, el, {displayMode:true, throwOnError:false, trust:true}); }
  catch(e) { el.textContent = tex; }
}

function buildChain(){
  var bar = document.getElementById('chainBar');
  bar.innerHTML = '';
  var names = lang==='zh'?CHAIN_ZH:CHAIN_EN;
  names.forEach(function(nm,i){
    var s = document.createElement('span');
    s.className = 'c-node';
    s.textContent = nm;
    s.onclick = function(){ scrollToNode(i); };
    bar.appendChild(s);
    if(i<names.length-1){
      var a = document.createElement('span');
      a.className = 'c-arr';
      a.textContent = '→';
      bar.appendChild(a);
    }
  });
}

function buildStats(){
  var bar = document.getElementById('statsBar');
  bar.innerHTML = '';
  var data = lang==='zh'?STATS_ZH:STATS_EN;
  data.forEach(function(s){
    var d = document.createElement('div');
    d.className = 'stat';
    d.innerHTML = '<div class="stat-n" style="color:'+s.c+'">'+s.n+'</div><div class="stat-l">'+s.l+'</div>';
    bar.appendChild(d);
  });
}

function buildLegend(){
  var bar = document.getElementById('legendBar');
  bar.innerHTML = '';
  var data = lang==='zh'?LEG_ZH:LEG_EN;
  data.forEach(function(d){
    var s = document.createElement('span');
    s.className = 'tag '+d[0];
    s.textContent = d[1];
    bar.appendChild(s);
  });
}

function renderItem(item, nodeId, subIdx, itemIdx, color) {
  var key = nodeId+'-'+subIdx+'-'+itemIdx;
  var div = document.createElement('div');
  var hdr = document.createElement('div');
  hdr.className = 'si-hdr';
  hdr.innerHTML = '<div class="si-dot" style="background:'+color+'"></div>'+
    '<span class="si-label">'+tx(item.l_zh,item.l_en)+'</span>'+
    '<span class="si-chev'+(openItems[key]?' open':'')+'">▶</span>';
  hdr.onclick = function(e){
    e.stopPropagation();
    openItems[key] = !openItems[key];
    render();
  };
  div.appendChild(hdr);
  if(openItems[key]){
    var body = document.createElement('div');
    body.className = 'si-body';
    if(item.eq){
      var eqDiv = document.createElement('div');
      eqDiv.className = 'eq-block';
      body.appendChild(eqDiv);
      setTimeout(function(){ renderKatex(item.eq, eqDiv); }, 0);
    }
    var txt = tx(item.x_zh, item.x_en);
    if(txt){
      var cls = item.warn ? 'warn-block' : (item.note ? 'note-block' : '');
      var p = document.createElement('div');
      if(cls) p.className = cls;
      p.textContent = txt;
      p.style.marginTop = '4px';
      body.appendChild(p);
    }
    div.appendChild(body);
  }
  return div;
}

function renderSub(sub, nodeId, subIdx){
  var key = nodeId+'-'+subIdx;
  var div = document.createElement('div');
  var hdr = document.createElement('div');
  hdr.className = 'ss-hdr'+(openSubs[key]?' open':'');
  hdr.innerHTML = '<div class="ss-title"><div class="ss-bar" style="background:'+sub.cl+'"></div>'+
    '<span style="color:'+(openSubs[key]?sub.cl:'var(--text)')+'">'+tx(sub.t_zh,sub.t_en)+'</span>'+
    '<span class="ss-chev'+(openSubs[key]?' open':'')+'">▼</span></div>';
  hdr.onclick = function(e){
    e.stopPropagation();
    openSubs[key] = !openSubs[key];
    render();
  };
  div.appendChild(hdr);
  if(openSubs[key]){
    var body = document.createElement('div');
    body.className = 'ss-body';
    sub.it.forEach(function(item,i){
      body.appendChild(renderItem(item, nodeId, subIdx, i, sub.cl));
    });
    div.appendChild(body);
  }
  return div;
}

function renderNode(node, idx){
  var isOpen = openNode === node.id;
  var isLast = idx === NODES.length - 1;
  var wrap = document.createElement('div');
  wrap.className = 'node';
  wrap.id = 'node-'+node.id;

  var hdr = document.createElement('div');
  hdr.className = 'n-hdr'+(isOpen?' open':'');
  var tagHtml = node.tg.map(function(t){ return '<span class="tag '+t[0]+'">'+tx(t[1],t[2])+'</span>'; }).join('');
  tagHtml += '<span class="tag t-in">'+node.si+'</span>';
  hdr.innerHTML = '<div class="n-num" style="background:'+node.cl+'">'+node.n+'</div>'+
    '<div style="flex:1;min-width:0"><div class="n-title">'+tx(node.t_zh,node.t_en)+'</div>'+
    '<div class="n-sub">'+tx(node.st_zh,node.st_en)+'</div>'+
    '<div class="n-tags">'+tagHtml+'</div></div>'+
    '<span class="chev'+(isOpen?' open':'')+'">▼</span>';
  hdr.onclick = function(){
    openNode = isOpen ? null : node.id;
    render();
  };
  wrap.appendChild(hdr);

  if(isOpen){
    var body = document.createElement('div');
    body.className = 'n-body open';
    node.ss.forEach(function(sub,i){
      body.appendChild(renderSub(sub, node.id, i));
    });
    wrap.appendChild(body);
  }

  if(!isLast){
    var conn = document.createElement('div');
    conn.className = 'conn';
    conn.innerHTML = '<div class="conn-line" style="background:'+node.cl+'55"></div>';
    wrap.appendChild(conn);
  }
  return wrap;
}

function render(){
  document.getElementById('mainTitle').textContent = tx('SVF Theory · 完整推导架构','SVF Theory · Complete Derivation Architecture');
  document.getElementById('mainSub').textContent = tx(
    '从 Navier–Stokes 方程到涌浪衰减标度律 · 15 节点三级展开 · 点击探索',
    'From Navier–Stokes to swell attenuation scaling law · 15 nodes, 3-level drill-down · Click to explore'
  );
  buildChain();
  buildStats();
  buildLegend();
  var flow = document.getElementById('flow');
  flow.innerHTML = '';
  NODES.forEach(function(node,i){
    flow.appendChild(renderNode(node,i));
  });
}

function scrollToNode(idx){
  openNode = NODES[idx].id;
  render();
  setTimeout(function(){
    var el = document.getElementById('node-'+NODES[idx].id);
    if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
  }, 50);
}

function toggleLang(){
  lang = lang==='zh'?'en':'zh';
  document.getElementById('langBtn').textContent = lang==='zh'?'EN / 中':'中 / EN';
  render();
}

render();
</script>
